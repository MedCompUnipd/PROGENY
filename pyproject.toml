[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "progeny-benchmark"
version = "0.1.0.dev0"
description = "Build time-resolved protein function benchmarks from GO releases"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "PROGENY contributors" }]
dependencies = ["rdflib>=7,<8"]

[tool.hatch.build.targets.wheel]
packages = ["src/progeny"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["reference", ".pixi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
